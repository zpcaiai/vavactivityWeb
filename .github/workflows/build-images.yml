name: Build Scan Sign Frontend Images

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: user-web, target: user-production}
          - {name: admin-web, target: admin-production}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/frontend.Dockerfile
          target: ${{ matrix.target }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/vav-${{ matrix.name }}:${{ github.sha }}
          platforms: linux/amd64
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Record immutable image identity
        run: printf '%s\n' "ghcr.io/${{ github.repository_owner }}/vav-${{ matrix.name }}@${{ steps.build.outputs.digest }}" > "${{ matrix.name }}.image"
      - uses: anchore/sbom-action@v0
        with: {image: "ghcr.io/${{ github.repository_owner }}/vav-${{ matrix.name }}@${{ steps.build.outputs.digest }}", format: cyclonedx-json, output-file: "${{ matrix.name }}.sbom.json"}
      - uses: aquasecurity/trivy-action@v0.36.0
        with: {image-ref: "ghcr.io/${{ github.repository_owner }}/vav-${{ matrix.name }}@${{ steps.build.outputs.digest }}", severity: "CRITICAL,HIGH", exit-code: "1", ignore-unfixed: true}
      - uses: sigstore/cosign-installer@v3.9.2
      - run: cosign sign --yes "ghcr.io/${{ github.repository_owner }}/vav-${{ matrix.name }}@${{ steps.build.outputs.digest }}"
      - uses: actions/upload-artifact@v4
        with: {name: "${{ matrix.name }}-image", path: "${{ matrix.name }}.image", retention-days: 30}
      - uses: actions/upload-artifact@v4
        with: {name: "${{ matrix.name }}-sbom", path: "${{ matrix.name }}.sbom.json", retention-days: 30}

  frontend-release-identities:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {pattern: "*-image", path: image-identities, merge-multiple: true}
      - name: Build frontend release handoff
        run: |
          printf '%s\n' \
            "frontend_commit=${GITHUB_SHA}" \
            "user_web_image=$(<image-identities/user-web.image)" \
            "admin_web_image=$(<image-identities/admin-web.image)" \
            > frontend-release.env
          sha256sum frontend-release.env > frontend-release.env.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-release-${{ github.sha }}
          path: |
            frontend-release.env
            frontend-release.env.sha256
          retention-days: 30
